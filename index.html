<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Capture Platform</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans overflow-hidden">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CheckCircle2 = ({ className, size=24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>;
    const Circle = ({ className, size=24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/></svg>;
    const FileText = ({ className, size=24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;
    const ChevronRight = ({ className, size=24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>;
    const ChevronLeft = ({ className, size=24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6"/></svg>;
    const LayoutIcon = ({ className, size=24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>;
    const MenuIcon = ({ className, size=24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>;
    const GripVertical = ({ className, size=24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>;

    const FORM_URLS = {
      appropriateness: "https://forms.gle/1iB2W7LfVcwswJLE8", 
      consistency: "https://forms.gle/1BBiXRpbR6LTv7EE8"       
    };

    const CASES_DATA = [
    ...Array.from({ length: 24 }, (_, i) => {
        const num = String(i + 1).padStart(2, '0');
        return {
        id: num,
        name: `Case ${num}`,
        pdfs: {
            pdf1: `./case${num}.pdf`,
            pdf2: `./Case${num}_rep2.pdf`,
            pdf3: `./Case${num}_rep3.pdf`,
        }
        };
    })
    ];


    function App() {
      const [activeCaseIndex, setActiveCaseIndex] = useState(0);
      const [currentStep, setCurrentStep] = useState(1);
      const [activePdfTab, setActivePdfTab] = useState(1);
      
      const [progress, setProgress] = useState(
        CASES_DATA.reduce((acc, c) => ({ ...acc, [c.id]: { step1: false, step2: false } }), {})
      );

      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [leftWidth, setLeftWidth] = useState(50); // 左側 PDF 區塊的寬度百分比
      const [isDragging, setIsDragging] = useState(false);
      const containerRef = useRef(null);

      const activeCase = CASES_DATA[activeCaseIndex];

      const handleToggleComplete = (step) => {
        setProgress(prev => ({
          ...prev,
          [activeCase.id]: {
            ...prev[activeCase.id],
            [`step${step}`]: !prev[activeCase.id][`step${step}`]
          }
        }));
      };

      const isCaseFullyComplete = (caseId) => {
        return progress[caseId].step1 && progress[caseId].step2;
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging || !containerRef.current) return;
          const containerRect = containerRef.current.getBoundingClientRect();
          let newLeftWidth = ((e.clientX - containerRect.left) / containerRect.width) * 100;
          newLeftWidth = Math.max(20, Math.min(newLeftWidth, 80));
          setLeftWidth(newLeftWidth);
        };

        const handleMouseUp = () => {
          setIsDragging(false);
        };

        if (isDragging) {
          document.addEventListener('mousemove', handleMouseMove);
          document.addEventListener('mouseup', handleMouseUp);
        }

        return () => {
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDragging]);

      return (
        <div className="flex h-screen w-full bg-gray-50 font-sans text-gray-800">
          
          {/* 左側導覽列 (可收折) */}
          <div className={`bg-white border-r border-gray-200 flex flex-col shadow-sm transition-all duration-300 ease-in-out z-20 ${
            isSidebarOpen ? 'w-64' : 'w-0 overflow-hidden border-r-0'
          }`}>
            <div className="w-64 flex flex-col h-full shrink-0">
              <div className="p-4 border-b border-gray-200 bg-blue-50 flex items-center justify-between">
                <h1 className="text-lg font-bold text-blue-800 flex items-center gap-2">
                  <LayoutIcon size={20} />
                  Home program
                </h1>
                <button 
                  onClick={() => setIsSidebarOpen(false)} 
                  className="text-blue-600 hover:bg-blue-200 p-1 rounded transition-colors"
                  title="收起側邊欄"
                >
                  <ChevronLeft size={20} />
                </button>
              </div>
              
              <div className="flex-1 overflow-y-auto p-3 space-y-1">
                <div className="text-xs font-semibold text-gray-400 mb-3 ml-2 uppercase tracking-wider">
                  List ({CASES_DATA.length} Cases)
                </div>
                
                {CASES_DATA.map((c, index) => {
                  const isActive = index === activeCaseIndex;
                  const isComplete = isCaseFullyComplete(c.id);
                  
                  return (
                    <button
                      key={c.id}
                      onClick={() => {
                        setActiveCaseIndex(index);
                        setCurrentStep(1);
                        setActivePdfTab(1);
                      }}
                      className={`w-full flex items-center justify-between p-3 rounded-lg transition-all ${
                        isActive ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-gray-100 text-gray-700'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        {isComplete ? (
                          <CheckCircle2 size={18} className={isActive ? 'text-blue-200' : 'text-green-500'} />
                        ) : (
                          <Circle size={18} className={isActive ? 'text-blue-300' : 'text-gray-300'} />
                        )}
                        <span className="font-medium">{c.name}</span>
                      </div>
                      {isActive && <ChevronRight size={18} />}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>

          {/* 主工作區 */}
          <div className="flex-1 flex flex-col min-w-0 relative">
            
            {/* 頂部步驟條 */}
            <div className="bg-white border-b border-gray-200 p-4 shadow-sm z-10 flex items-center relative">
              
              {/* 展開側邊欄按鈕 (只在側邊欄收起時顯示) */}
              {!isSidebarOpen && (
                <button 
                  onClick={() => setIsSidebarOpen(true)}
                  className="absolute left-4 p-2 text-gray-600 hover:bg-gray-100 rounded-md transition-colors flex items-center"
                  title="展開側邊欄"
                >
                  <MenuIcon size={20} />
                </button>
              )}

              <div className="flex items-center justify-center flex-1 max-w-4xl mx-auto">
                <button 
                  onClick={() => { setCurrentStep(1); setActivePdfTab(1); }}
                  className={`flex items-center gap-3 px-6 py-2 rounded-full transition-all ${
                    currentStep === 1 ? 'bg-blue-100 text-blue-700 ring-2 ring-blue-500' : 'text-gray-500 hover:bg-gray-100'
                  }`}
                >
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold ${
                    progress[activeCase.id].step1 ? 'bg-green-500 text-white' : (currentStep === 1 ? 'bg-blue-600 text-white' : 'bg-gray-200')
                  }`}>
                    {progress[activeCase.id].step1 ? <CheckCircle2 size={16} /> : '1'}
                  </div>
                  <div className="text-left">
                    <div className="text-sm font-bold">第一階段：適切性評估</div>
                    <div className="text-xs opacity-80">僅檢視第 1 份計畫</div>
                  </div>
                </button>

                <div className="w-12 h-px bg-gray-300 mx-4 sm:w-24 md:w-32"></div>

                <button 
                  onClick={() => setCurrentStep(2)}
                  className={`flex items-center gap-3 px-6 py-2 rounded-full transition-all ${
                    currentStep === 2 ? 'bg-blue-100 text-blue-700 ring-2 ring-blue-500' : 'text-gray-500 hover:bg-gray-100'
                  }`}
                >
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold ${
                    progress[activeCase.id].step2 ? 'bg-green-500 text-white' : (currentStep === 2 ? 'bg-blue-600 text-white' : 'bg-gray-200')
                  }`}>
                    {progress[activeCase.id].step2 ? <CheckCircle2 size={16} /> : '2'}
                  </div>
                  <div className="text-left">
                    <div className="text-sm font-bold">第二階段：一致性評估</div>
                    <div className="text-xs opacity-80">綜合檢視 3 份計畫</div>
                  </div>
                </button>
              </div>
            </div>

            {/* 雙欄內容區 (含可拖拉分隔線) */}
            <div ref={containerRef} className="flex-1 flex overflow-hidden relative">
              
              {/* 拖拉防護層：避免滑鼠拖移到 iframe 上面時失效 */}
              {isDragging && <div className="absolute inset-0 z-50 cursor-col-resize"></div>}

              {/* 左欄：PDF 閱讀區 */}
              <div style={{ width: `${leftWidth}%` }} className="flex flex-col bg-gray-100 shrink-0">
                <div className="bg-white p-2 border-b flex items-center gap-2">
                  <FileText size={18} className="text-gray-500 ml-2" />
                  <span className="font-semibold text-gray-700 mr-2 truncate">
                    {currentStep === 1 ? '第 1 份 Home Program' : '切換不同版本的 Home Program：'}
                  </span>
                  
                  {currentStep === 2 && (
                    <div className="flex bg-gray-100 p-1 rounded-lg shrink-0">
                      {[1, 2, 3].map(num => (
                        <button
                          key={num}
                          onClick={() => setActivePdfTab(num)}
                          className={`px-3 py-1 sm:px-4 text-sm font-medium rounded-md transition-colors ${
                            activePdfTab === num 
                              ? 'bg-white text-blue-600 shadow-sm' 
                              : 'text-gray-500 hover:bg-gray-200'
                          }`}
                        >
                          計畫 {num}
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                <div className="flex-1 p-4 overflow-hidden">
                  <div className="w-full h-full bg-white rounded-xl shadow-inner border border-gray-200 overflow-hidden">
                    <iframe 
                      src={activeCase.pdfs[`pdf${currentStep === 1 ? 1 : activePdfTab}`]} 
                      className="w-full h-full border-0"
                      title="PDF Viewer"
                    />
                  </div>
                </div>
              </div>

              {/* 可拖拉分隔線 (Draggable Divider) */}
              <div 
                className="w-3 bg-gray-200 hover:bg-blue-300 active:bg-blue-400 cursor-col-resize flex items-center justify-center shrink-0 transition-colors z-10"
                onMouseDown={() => setIsDragging(true)}
                title="拖曳以調整欄寬"
              >
                <div className="h-8 flex flex-col justify-center gap-1 text-gray-400">
                  <GripVertical size={16} />
                </div>
              </div>

              {/* 右欄：表單區 */}
              <div style={{ width: `${100 - leftWidth}%` }} className="flex flex-col bg-white shrink-0 border-l border-gray-200">
                <div className="bg-white p-3 border-b flex items-center justify-between px-4 shrink-0">
                  <div className="flex items-center gap-2 text-blue-800 font-bold truncate">
                    {currentStep === 1 ? '填寫：適切性評估表' : '填寫：一致性評估表'}
                  </div>
                  
                  <button 
                    onClick={() => handleToggleComplete(currentStep)}
                    className={`flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium transition-colors shrink-0 ${
                      progress[activeCase.id][`step${currentStep}`]
                        ? 'bg-green-100 text-green-700 hover:bg-green-200'
                        : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                    }`}
                  >
                    {progress[activeCase.id][`step${currentStep}`] ? (
                      <><CheckCircle2 size={16} /> 已完成本表單</>
                    ) : (
                      <><Circle size={16} /> 標記為完成</>
                    )}
                  </button>
                </div>
                
                <div className="flex-1 relative bg-gray-50">
                  <div className="absolute top-0 w-full bg-blue-50 border-b border-blue-100 p-2 text-center text-xs text-blue-600 z-0">
                    請確認表單已點擊「提交」後，再點選右上角的「標記為完成」。
                  </div>
                  <iframe
                    src={currentStep === 1 ? FORM_URLS.appropriateness : FORM_URLS.consistency}
                    className="w-full h-full z-10 relative pt-8"
                    title="Google Form"
                    frameBorder="0"
                    marginHeight="0"
                    marginWidth="0"
                  >
                    載入中…
                  </iframe>
                </div>
              </div>

            </div>
          </div>https://github.com/enolaugh/pt-feedback-platform/tree/main
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
